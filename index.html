<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PO Tracking Live Dashboard</title>
  
  <!-- Choices.js for Multi-Select Dropdowns -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <!-- Top Navbar -->
  <header>
    <div class="header-left">
      <h1>PO TRACKER <span class="live-dot"></span> LIVE TRACKER</h1>
    </div>
    <div class="header-right">
      <span id="currentDate"></span>
    </div>
  </header>

  <div class="container">
    <!-- Upload Section -->
    <div class="card upload-section">
      <h2>Upload Latest Reports</h2>
      <div class="upload-grid">
        <div class="upload-box">
          <h3>PO Data Dump (Excel / CSV)</h3>
          <div class="upload-controls">
            <label for="fileInput" class="btn-upload">Choose File</label>
            <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" hidden>
            <span id="fileName" class="file-name">No file chosen</span>
          </div>
          <p id="statusMsg" class="status-msg"></p>
        </div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="card filter-section" id="filterSection" style="display:none;">
      <div class="filter-grid">
        <div class="filter-item">
          <label>CATEGORY</label>
          <select id="filterCategory" multiple></select>
        </div>
        <div class="filter-item">
          <label>CITY</label>
          <select id="filterCity" multiple></select>
        </div>
        <div class="filter-item">
          <label>STATUS</label>
          <select id="filterStatus" multiple></select>
        </div>
        <div class="filter-item search-box">
          <label>SEARCH</label>
          <input type="text" id="searchInput" placeholder="Search PO / Vendor...">
        </div>
        <div class="filter-actions">
          <button id="resetBtn" class="btn-reset">Reset Filters</button>
          <button id="exportBtn" class="btn-export">Export CSV</button>
        </div>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid" id="kpiGrid" style="display:none;">
      <div class="kpi-card">
        <div class="kpi-label">TOTAL POs</div>
        <div class="kpi-value" id="kpiTotalPOs">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">TOTAL QTY</div>
        <div class="kpi-value" id="kpiTotalQty">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">OPEN POs</div>
        <div class="kpi-value" id="kpiOpen">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">EXPIRED</div>
        <div class="kpi-value" id="kpiExpired" style="color: #dc2626;">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">EXPIRING ≤ 30D</div>
        <div class="kpi-value" id="kpiExpiring" style="color: #d97706;">0</div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="card main-content" id="mainContent" style="display:none;">
      <div class="card-header">
        <h2 id="viewTitle">PO Tracking — Overview</h2>
        <span id="rowCount" style="font-size: 0.85rem; color: #64748b;">0 filtered rows</span>
      </div>
      
      <div class="table-responsive">
        <table id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Choices.js Script -->
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
